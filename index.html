<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gate mechanism — interactive 3D viewer</title>
<style>
:root{color-scheme:light dark;--background:light-dark(#f5f6f8,#1a1c20);--foreground:light-dark(#24262b,#eceef2);--muted-foreground:light-dark(#60656e,#b3b9c2);--border:light-dark(#cdd1d8,#555b65);--control:light-dark(#ffffff,#2a2e35);--primary:light-dark(#272b33,#e4e8ef);--primary-foreground:light-dark(#ffffff,#1b1e24);font:14px/1.45 system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--background);color:var(--foreground)}
main{max-width:1200px;margin:0 auto}
.viz-controls,.viz-row{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin:8px 0}
.btn,.form-select{font:inherit;color:var(--foreground);background:var(--control);border:1px solid var(--border);border-radius:7px;padding:8px 12px}
.btn{cursor:pointer}.btn[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground)}
.form-check{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.form-check-input{width:16px;height:16px;margin:0;accent-color:var(--primary)}
.form-label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.form-range{display:block;width:100%;margin:12px 0;accent-color:var(--primary)}
.text-small{font-size:12px}.text-muted{color:var(--muted-foreground)}
.tabular-nums{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
summary{cursor:pointer;padding:5px 0}
@media(pointer:coarse){.btn,.form-select,summary{min-height:44px}.form-check{min-height:44px}}
@media(max-width:480px){body{padding:10px}}
</style>
</head>
<body><main>
<div id="gate-polished-viewer">
  <div class="viz-controls pg-toolbar" aria-label="View controls">
    <button class="btn" type="button" data-view="inside" aria-pressed="false">Bolt side</button>
    <button class="btn" type="button" data-view="outside" aria-pressed="true">Keypad side</button>
    <button class="btn" type="button" data-view="top" aria-pressed="false">Above</button>
    <button class="btn" type="button" data-view="open" aria-pressed="false">Opening</button>
    <button class="btn" type="button" data-fly aria-pressed="true">Exit fly</button>
    <button class="btn" type="button" data-fullscreen aria-pressed="false">Fullscreen</button>
  </div>
  <div class="viz-controls" aria-label="Whole gate context">
    <label class="form-check"><input class="form-check-input" type="checkbox" data-context="fullGate"><span class="form-check-label">Full gate frame</span></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-context="fullPost"><span class="form-check-label">Full posts</span></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-context="pickets"><span class="form-check-label">Pickets + rails</span></label>
  </div>
  <div class="pg-stage" role="group" aria-label="Gate mechanism. Fly mode is on. Click the view for WASD movement. Shift or E moves toward the top of the view; Control or Q moves toward the bottom.">
    <canvas data-gpu role="img" aria-label="Gate mechanism cutaway with a single rotating actuator, flush keypad, rounded edges, and outdoor lighting."></canvas>
    <img data-cpu alt="Gate mechanism preview and progressive CPU rendering.">
    <div class="pg-resume"><button class="btn" type="button" data-resume-fly>Click to move</button></div>
  </div>
  <div class="pg-footer">
    <div class="viz-row"><span data-render-status class="text-small tabular-nums" aria-label="Render status">Preparing view…</span></div>
    <div class="text-small text-muted" data-controls-hint>Fly mode · Click the view to use WASD</div>
    <div class="text-small text-muted" data-display-note aria-live="polite"></div>
    <span class="sr-only" data-announcement aria-live="polite">Mechanism view ready.</span>
    <div class="viz-controls">
      <button class="btn" type="button" data-pause aria-pressed="false">Pause rendering</button>
      <button class="btn" type="button" data-play>Play mechanism</button>
      <label class="form-label">Detail <select class="form-select" data-quality aria-label="Render detail"><option value="balanced">Balanced</option><option value="sharp">Sharp</option><option value="ultra">Ultra</option></select></label>
      <label class="form-label" data-flight-speed>Fly speed <select class="form-select" data-speed aria-label="Fly speed"><option value="180">Slow</option><option value="600" selected>Normal</option><option value="1800">Fast</option></select></label>
    </div>
    <details class="pg-parts"><summary class="cursor-interaction">Mechanism parts · <span data-part-count>11</span> visible</summary><div class="pg-part-list" data-parts aria-label="Visible mechanism parts"></div></details>
    <div class="pg-sliders">
      <div><label class="form-label" for="flight-motion">Opening <output data-motion-readout class="tabular-nums">Bolt 0 mm · Gate 0°</output></label><input class="form-range" id="flight-motion" data-motion type="range" min="0" max="16" step="0.05" value="0"></div>
      <div><label class="form-label" for="flight-light">Sky rotation <output data-light-readout class="tabular-nums">0°</output></label><input class="form-range" id="flight-light" data-light type="range" min="-180" max="180" step="5" value="0"></div>
    </div>
    <details class="pg-device text-small"><summary class="cursor-interaction" data-graphics-label>Graphics: checking…</summary><div data-device></div></details>
  </div>
</div>
<style>
#gate-polished-viewer .pg-stage{position:relative;height:520px;width:100%;touch-action:none;cursor:grab;margin:8px 0;overflow:hidden}
#gate-polished-viewer .pg-stage canvas,#gate-polished-viewer .pg-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
#gate-polished-viewer .pg-stage.pg-flying{cursor:grab}
#gate-polished-viewer .pg-stage.pg-dragging{cursor:grabbing}
#gate-polished-viewer .pg-resume{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
#gate-polished-viewer .pg-resume button{pointer-events:auto}
#gate-polished-viewer .pg-sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:12px}
#gate-polished-viewer .pg-part-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 16px;padding:12px 0}
#gate-polished-viewer .pg-parts{margin:8px 0}
#gate-polished-viewer .pg-device{margin-top:8px;overflow-wrap:anywhere}
#gate-polished-viewer [data-display-note]:empty{display:none}
#gate-polished-viewer [hidden]{display:none!important}
#gate-polished-viewer[data-expanded="true"] .pg-stage{height:720px}
#gate-polished-viewer:fullscreen{display:flex;flex-direction:column;box-sizing:border-box;width:100%;height:100%;padding:12px 20px;background:var(--background);color:var(--foreground)}
#gate-polished-viewer:fullscreen .pg-stage{flex:1;min-height:160px;height:auto}
#gate-polished-viewer:fullscreen .pg-toolbar{flex:none}
#gate-polished-viewer:fullscreen .pg-footer{flex:none;max-height:42%;overflow:auto}
@media(max-width:480px){#gate-polished-viewer .pg-stage{height:410px}#gate-polished-viewer .pg-sliders{grid-template-columns:1fr;gap:8px}}
</style>

 if(expanded){expanded=false;root.dataset.expanded='false';fullscreenChanged();return;}
 try{if(!fullscreenAvailable)throw Error('Fullscreen not allowed');await root.requestFullscreen({navigationUI:'hide'});}
 catch{fullscreenAvailable=false;expanded=true;root.dataset.expanded='true';fullscreenChanged();announce('This embedded view cannot enter fullscreen. The view is enlarged; use the browser version for fullscreen.');}
});
document.addEventListener('fullscreenchange',fullscreenChanged);
root.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{
 stopPlaying();if(flyActive)pauseFlight();az=button.dataset.view==='outside'?-.35:2.72;el=button.dataset.view==='top'?1.10:.16;zoom=1;seq=button.dataset.view==='open'?8:0;motion.value=String(seq);fitPending=true;
 root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));lastPose='';requestPreview();
}));
pauseButton.addEventListener('click',()=>{paused=!paused;pauseButton.textContent=paused?'Resume rendering':'Pause rendering';pauseButton.setAttribute('aria-pressed',String(paused));if(paused){stopRender();setStatus(`${deviceLabel()} rendering paused · ${samples} samples`);}else if(samples>0&&samples<sampleTarget()){renderJob=requestAnimationFrame(gpu?gpuTick:cpuTick);}else requestPreview();});
playButton.addEventListener('click',()=>{
 if(playing){stopPlaying();requestPreview();return;}
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){seq=seq<3?3.5:seq<8?8:0;motion.value=seq;lastPose='';requestPreview();return;}
 stopRender();if(seq>=15.95)seq=0;playing=true;playButton.textContent='Pause mechanism';let before=performance.now();
 function tick(now){if(!playing||!root.isConnected)return;if(now-before<(gpu?33:100)){animationJob=requestAnimationFrame(tick);return;}seq=Math.min(16,seq+(now-before)/1000);before=now;motion.value=String(seq);requestPreview();if(seq>=16){stopPlaying();requestPreview();}else animationJob=requestAnimationFrame(tick);}
 animationJob=requestAnimationFrame(tick);
});
motion.addEventListener('input',()=>{stopPlaying();seq=Number(motion.value);lastPose='';requestPreview();});
root.querySelector('[data-light]').addEventListener('input',e=>{setLights(Number(e.target.value));root.querySelector('[data-light-readout]').textContent=e.target.value+'°';requestPreview();});
const partsBox=root.querySelector('[data-parts]');for(const [key,label] of Object.entries(partLabels)){
 const row=document.createElement('label');row.className='form-check';const input=document.createElement('input');input.type='checkbox';input.checked=true;input.className='form-check-input';input.dataset.part=key;const text=document.createElement('span');text.className='form-check-label';text.textContent=label;row.append(input,text);partsBox.appendChild(row);
 input.addEventListener('change',()=>{partVisibility[key]=input.checked;sceneDirty=true;root.querySelector('[data-part-count]').textContent=String(Object.keys(partLabels).filter(k=>partVisibility[k]).length);requestPreview();});
}
root.querySelectorAll('[data-context]').forEach(input=>input.addEventListener('change',()=>{partVisibility[input.dataset.context]=input.checked;sceneDirty=true;if(!flyMode){fitPending=true;zoom=1;}requestPreview();}));
root.querySelector('[data-quality]').addEventListener('change',e=>{quality=e.target.value;requestPreview();});
stage.addEventListener('pointerdown',e=>{
 if(e.target.closest('button')||e.button!==0)return;
 stopPlaying();stopRender();if(flyMode){e.preventDefault();focusFlight();flyActive=true;controlsHint();if(locked||document.pointerLockElement===stage)return;drag={x:e.clientX,y:e.clientY,fly:true};}else drag={x:e.clientX,y:e.clientY,az,el};
 stage.setPointerCapture(e.pointerId);stage.classList.add('pg-dragging');
 if(flyMode)captureMouse();
});
stage.addEventListener('pointermove',e=>{if(!drag)return;if(drag.fly){look(e.clientX-drag.x,e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY;}else{az=drag.az+(e.clientX-drag.x)*.008;el=Math.max(-1.54,Math.min(1.54,drag.el+(e.clientY-drag.y)*.008));clearPreset();requestPreview();}});
function release(){if(!drag)return;drag=null;stage.classList.remove('pg-dragging');requestPreview();}
stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);stage.addEventListener('lostpointercapture',release);
stage.addEventListener('wheel',e=>{e.preventDefault();if(flyMode){flyPosition=V.add(flyPosition,V.mul(axes().normal,e.deltaY*.25));}else zoom=Math.max(.08,Math.min(30,zoom*Math.exp(-e.deltaY*.001)));requestPreview();},{passive:false});
gpuCanvas.addEventListener('webglcontextlost',e=>{e.preventDefault();stopRender();gpu=null;root.dataset.gpuFallback='WebGL context lost';graphicsStatus();requestPreview();});
gpuCanvas.addEventListener('webglcontextrestored',()=>{try{gpu=createGPU(gpuCanvas);if(gpu&&skyImage.complete&&skyImage.naturalWidth)gpu.setSkyImage(skyImage);lastPose='';}catch(e){dropGPU(e);}graphicsStatus();requestPreview();});
let lastSize='';if(typeof ResizeObserver==='function')new ResizeObserver(()=>{const k=stage.clientWidth+':'+stage.clientHeight;if(k!==lastSize){lastSize=k;requestPreview();}}).observe(stage);
if(typeof IntersectionObserver==='function')new IntersectionObserver(entries=>{const was=visible;visible=entries[0].isIntersecting;if(!visible){stopRender();stopPlaying();if(flyActive)pauseFlight();}else if(!was&&!paused)requestPreview();}).observe(stage);
if(typeof MutationObserver==='function')new MutationObserver(()=>{readTheme();requestPreview();}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopRender();stopPlaying();if(flyActive)pauseFlight();}else if(!paused)requestPreview();});
readTheme();try{gpu=createGPU(gpuCanvas);}catch(e){dropGPU(e);}graphicsStatus();controlsHint();fullscreenChanged();
root.dataset.actuatorBars=String(parts.filter(p=>p.group==='actuator').length);root.dataset.triangleCount=String(parts.reduce((s,p)=>s+p.t.length/3,0));preview();
const skyImage=new Image();skyImage.onload=()=>{if(gpu){try{gpu.setSkyImage(skyImage);requestPreview();}catch{root.dataset.skyTextureFallback='true';}}};skyImage.src=skyAsset.url;

})();
</script>

</main></body></html>
